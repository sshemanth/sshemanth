164.17000000000002" text-anchor="middle" font-size="13" fill="#9FB2CC">0.721</text><text class="lab" style="animation-delay:1.50s" x="786.75" y="161.18" text-anchor="middle" font-size="13" font-weight="700" fill="#E6EDF7">0.734</text><text x="753.75" y="368" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#E6EDF7">ET</text><path class="bar" style="animation-delay:0.66s" d="M946.25,340 V301.68 Q946.25,297.68 950.25,297.68 H1006.25 Q1010.25,297.68 1010.25,301.68 V340 Z" fill="#6B7A90"/><path class="bar" style="animation-delay:0.81s" d="M1012.25,340 V230.15 Q1012.25,226.15 1016.25,226.15 H1072.25 Q1076.25,226.15 1076.25,230.15 V340 Z" fill="#4F8CFF"/><text class="lab" style="animation-delay:1.50s" x="978.25" y="287.68" text-anchor="middle" font-size="13" fill="#9FB2CC">0.184</text><text class="lab" style="animation-delay:1.60s" x="1044.25" y="216.15" text-anchor="middle" font-size="13" font-weight="700" fill="#E6EDF7">0.495</text><text x="1011.25" y="368" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#E6EDF7">RC</text>
