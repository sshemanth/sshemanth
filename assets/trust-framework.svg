<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="408" viewBox="0 0 1200 408" role="img" aria-label="TRUST-ADMET framework. Molecules become Morgan fingerprints, molecular graphs or SMILES tokens. Six model families (Random Forest, XGBoost, MLP, GCN, GIN, ChemBERTa) train on random and scaffold splits. Every prediction passes a trust layer of calibration, applicability domain, uncertainty and explainability, then ships as a CLI, REST API, Gradio app and Docker image."><style>
.up{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}.in{opacity:0;animation:fin .6s ease-out forwards}@keyframes fin{to{opacity:1}}.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:gw .9s cubic-bezier(.2,.8,.2,1) forwards}@keyframes gw{to{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.up,.in{opacity:1}.bar{transform:none}}
