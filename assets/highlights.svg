<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="Highlights: TC lesion-wise Dice 0.715 on the BraTS-METS hidden test; 2.7 times better resection cavity Dice with Primus; AUROC 0.912 on external B3DB for TRUST-ADMET; 3 MICCAI manuscripts reviewed.">
