name: Update profile stats

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/stats.py, .github/workflows/profile.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build stats card
        run: python scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Build contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#E9B25A
            dist/snake-light.svg?color_snake=#1E3A5F

      - name: Commit changes
        run: |
          cp dist/snake-dark.svg dist/snake-light.svg assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/snake-dark.svg assets/snake-light.svg
          git diff --cached --quiet || git commit -m "Update profile stats"
          git push
