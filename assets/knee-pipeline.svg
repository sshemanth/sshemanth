-weight="700" fill="#E6EDF7">12 scores</text><text x="1054" y="317.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9FB2CC">hidden test</text></g><text class="in" style="animation-delay:1.8s" x="1105" y="360" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#E9B25A">0.880 macro AUC</text></svg>