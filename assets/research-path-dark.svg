<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Research path in three steps: 01 challenge paper at MICCAI 2026, resection cavity F1 from 0.238 to 0.586; 02 research project, 34 of 45 cavities found, up from 30; 03 current work on lesion-level guarantees with conformal prediction, in progress.">
<rect x=".5" y=".5" width="1199" height="259" rx="16" fill="#0D1117" stroke="#2A3036"/>
<line x1="72" y1="72" x2="792" y2="72" stroke="#2A3036" stroke-width="2"/>
<line x1="72" y1="72" x2="792" y2="72" stroke="#AAC4DD" stroke-width="2" stroke-dasharray="720" stroke-dashoffset="720"><animate attributeName="stroke-dashoffset" from="720" to="0" dur="2.4s" fill="freeze"/></line>
<circle cx="72" cy="72" r="8" fill="#0D1117" stroke="#AAC4DD" stroke-width="2"/>
<text x="92" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#AAC4DD">01</text>
<text x="128" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA0A5">Challenge paper, MICCAI 2026</text>
<text x="64" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ECEDEF">Region-aware segmentation</text>
<text x="64" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ECEDEF">of brain metastases</text>
<text x="64" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#AAC4DD">0.238 → 0.586</text>
<text x="64" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA0A5">resection cavity F1</text>
<circle cx="432" cy="72" r="8" fill="#0D1117" stroke="#AAC4DD" stroke-width="2"/>
<text x="452" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#AAC4DD">02</text>
<text x="488" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA0A5">Research project</text>
<text x="424" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ECEDEF">Recovering missed</text>
<text x="424" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ECEDEF">resection cavities</text>
<text x="424" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#AAC4DD">34 of 45</text>
<text x="424" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA0A5">cavities found, up from 30</text>
<circle cx="792" cy="72" r="8" fill="#AAC4DD" stroke="#AAC4DD" stroke-width="2"/>
<text x="812" y="60" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#AAC4DD">03</text>
<text x="848" y="57" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA0A5">Now</text>
<text x="784" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ECEDEF">Lesion-level guarantees</text>
<text x="784" y="148" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ECEDEF">with conformal prediction</text>
<text x="784" y="204" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#AAC4DD">In progress</text>
<text x="784" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9BA0A5">patient-grouped splits</text>
</svg>
