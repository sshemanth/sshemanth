<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="786" viewBox="0 0 1200 786" role="img" aria-label="Capability stack. L6 Medical AI: 3D segmentation, nnU-Net v2, brain MRI (BraTS), knee MRI, 12-lead ECG, SimpleITK, NIfTI / DICOM, report-derived labels, small-lesion detection. L5 Research: experiment design, ablation studies, patient-grouped splits, external validation, multi-seed statistics, failure analysis, scientific writing, peer review (MICCAI), reproducible releases. L4 LLMs and agents: Hugging Face Transformers, ChemBERTa, Qwen, MedGemma, Ollama (local LLMs), LLM data labelling, prompt engineering, MCP servers, Claude Code. L3 Deep learning: PyTorch, CNNs, vision transformers (Primus), GNNs (GCN, GIN), PyTorch Geometric, deep RL (SAC, PPO), custom losses (Tversky). L2 Machine learning: scikit-learn, XGBoost, Random Forest, calibration, conformal prediction, uncertainty estimation, RDKit, NumPy / pandas. L1 Infrastructure: Linux, Bash, SSH, Git, Docker, CUDA GPUs, RunPod (A100), GCP / gcloud, Kaggle."><style>
.up{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{to{opacity:1}}
.slide{opacity:0;animation:slide .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up,.in,.slide{opacity:1}}
