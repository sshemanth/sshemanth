<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Research pipeline: Data: brain and knee MRI, 12-lead ECG, molecular graphs, radiology reports; Prepare: resample, normalise, patient-grouped splits, leakage and overlap, checks; Model: CNNs (nnU-Net), transformers (Primus), GNNs (GCN, GIN), LLMs (Qwen, Gemma); Validate: k-fold, 5 seeds, hidden + external tests, ablations, error analysis; Trust: calibration (ECE), conformal prediction, uncertainty, applicability domain; Ship: Docker, CLI, API, web demo, Zenodo DOI, papers and reviews"><style>
.up{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{to{opacity:1}}
.slide{opacity:0;animation:slide .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up,.in,.slide{opacity:1}}
