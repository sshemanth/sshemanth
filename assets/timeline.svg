<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="422" viewBox="0 0 1200 422" role="img" aria-label="Timeline as a git log. now: lesion-level conformal guarantees for brain metastasis segmentation. now: AF detection from 12-lead ECG with explainable AI (PTB-XL -&gt; Chapman-Shaoxing). 2026: complete Master of Artificial Intelligence coursework, UTS. 2026: Primus + cavity-focused sampling: resection cavity Dice 0.18 -&gt; 0.50. 2026: BraTS-METS solo entry, paper accepted; reviewed 3 challenge manuscripts. 2026: release TRUST-ADMET on Zenodo (CLI, API, web demo, Docker). 2026: knee MRI, 12 findings from LLM-fused report labels: 0.880 macro AUC. 2025: start Master of AI at UTS Sydney; branch research. 2024: B.Tech in Computer Science, JNTU Kakinada (2020-2024)."><style>
.up{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{to{opacity:1}}
.slide{opacity:0;animation:slide .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up,.in,.slide{opacity:1}}
