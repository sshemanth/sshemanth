<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
<title id="t">Sri Sai Hemanth Bollepalli</title>
<desc id="d">Medical AI researcher. Animated brain MRI slice with segmented regions: whole tumor, tumor core, enhancing tumor and resection cavity.</desc>
<style>
.up{opacity:0;animation:up .8s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.draw{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fill{opacity:0;animation:fill 1s ease-out forwards}
@keyframes fill{to{opacity:1}}
.lab{opacity:0;animation:fill .7s ease-out forwards}
.scan{animation:scan 5s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateX(-150px)}to{transform:translateX(150px)}}
.pulse{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.glow{animation:glow 4s ease-in-out 3s infinite}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.up,.draw,.fill,.lab{opacity:1;stroke-dashoffset:0}}
</style>
