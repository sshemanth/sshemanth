<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="ct cd">
<title id="ct">Primus with cavity-focused sampling vs standard nnU-Net</title>
<desc id="cd">Dice on the same 260 cases. Standard nnU-Net: WT 0.747, TC 0.752, ET 0.721, RC 0.184. Primus with RC sampling: WT 0.760, TC 0.767, ET 0.734, RC 0.495.</desc>
<style>
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.lab{opacity:0;animation:fade .5s ease-out forwards}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.bar{transform:none}.lab{opacity:1}}
</style>
<rect width="1200" height="400" rx="18" fill="#0C1830" stroke="#22345A"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
