<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-label="Knee MRI pipeline. Radiology reports are scored by three labellers: regex (macro AUC 0.683), MedGemma-4B (0.768) and Qwen 27B served locally (0.858). Their average gives soft labels (0.870). MRI series go into a 64-slice cache and a 2.5D ConvNeXt-Tiny with per-finding attention, trained on the soft labels, giving 12 finding scores with 0.880 macro AUC on the hidden test."><style>
.up{opacity:0;animation:up .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in{opacity:0;animation:in .6s ease-out forwards}
@keyframes in{to{opacity:1}}
.slide{opacity:0;animation:slide .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes slide{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.flow{stroke-dasharray:4 6;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-20}}
.blink{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}.up,.in,.slide{opacity:1}}
</style><defs><marker id="ka" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5C76A3"/></marker></defs><rect width="1200" height="392" rx="18" fill="#0C1830" stroke="#22345A"/><text x="30" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7FA6E0">knee-mri-weak-supervision / pipeline</text><text x="30" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#E6EDF7">Training a 12-finding knee MRI model with no expert image labels</text><g class="up" style="animation-delay:0.10s"><rect x="30" y="128" width="200" height="64" rx="10" fill="#0F1D36" stroke="#6B7A90" stroke-opacity=".6"/><text x="44" y="157.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#E6EDF7">Radiology reports</text><text x="44" y="175.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9FB2CC">free text, 6 languages</text></g><g class="up" style="animation-delay:0.25s"><rect x="290" y="92" width="250" height="44" rx="10" fill="#0F1D36" stroke="#1F9E8F" stroke-opacity=".6"/><text x="304" y="111.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#E6EDF7">Regex labeller</text><text x="304" y="129.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9FB2CC">rules + negation</text><text x="526" y="119.0" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#E9B25A">0.683</text></g><path class="in" style="animation-delay:0.40s" d="M230,160 C259.0,160 259.0,114 288,114" stroke="#3E5A8A" stroke-width="1.5" fill="none" marker-end="url(#ka)"/><circle r="3" 